name: Python tests

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
      - master
      - 'release_*'
  pull_request:

permissions:
  contents: read # to fetch code (actions/checkout)
  id-token: write

defaults:
  run:
    shell: bash -l {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "Python tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  python-sdist-test:
    runs-on: ${{ matrix.os }}
    name: Test installing Python XGBoost from the source distribution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          submodules: 'true'
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: dmlc/xgboost-devops/actions/miniforge-setup@main
        with:
          environment-name: sdist_test
          environment-file: ops/conda_env/sdist_test.yml
      - uses: dmlc/xgboost-devops/actions/sccache@main
        with:
          cache-key-prefix: ${{ github.job }}-${{ matrix.os }}
      - name: Install extra package for MacOS
        run: |
          mamba install -c conda-forge llvm-openmp
        if: matrix.os == 'macos-15-intel'
      - name: Build and install XGBoost
        run: bash ops/pipeline/test-python-sdist.sh
      - run: sccache --show-stats

  python-system-installation-on-ubuntu:
    name: Test XGBoost Python package System Installation on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          submodules: 'true'
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: dmlc/xgboost-devops/actions/sccache@main
      - run: bash ops/pipeline/test-python-with-sysprefix.sh
      - run: sccache --show-stats
